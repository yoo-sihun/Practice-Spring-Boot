server:
  port: 8080

spring:
  application:
    name: demo

  datasource:
    url: jdbc:h2:./db_dev;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        use_sql_comments: true
    hibernate:
      ddl-auto: update
    show-sql: true
    #터미널 빌드 창 색깔별로 구분
    #output:
    #  ansi:
    #   enabled: always

# 정보창 info = 일상정 정보
# bind, extract : 눈으로 봐야하는 파라미터 볼 수 있게 해준다
logging: # 입력되는 정보를 터미널에서 확인할 수 있게 해준다
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE